<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sales Outstanding Dashboard</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--tx:#1c2330;--mut:#6b7587;--bd:#e3e6ec;--ac:#2f5bea;
--b1:#4cae82;--b2:#e9b84a;--b3:#ee8a3c;--b4:#d9463f;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12151c;--card:#1a1f29;--tx:#e8ebf2;--mut:#939db0;--bd:#2b3242;--ac:#7b9bff;--b1:#58c08f;--b2:#e6bf5c;--b3:#f19a52;--b4:#ec5f58;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#12151c;--card:#1a1f29;--tx:#e8ebf2;--mut:#939db0;--bd:#2b3242;--ac:#7b9bff;--b1:#58c08f;--b2:#e6bf5c;--b3:#f19a52;--b4:#ec5f58;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0}
.sub{color:var(--mut);font-size:13px}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
button,select,input{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px}
.kpi b{display:block;font-size:22px;margin-top:2px}
.kpi span{color:var(--mut);font-size:12px}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--mut);margin:4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.tabs .sp{flex:1}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:720px}
th,td{padding:9px 8px;text-align:right;border-bottom:1px solid var(--bd);white-space:nowrap}
th{font-size:12px;color:var(--mut);font-weight:600;cursor:pointer;user-select:none}
th:first-child,td:first-child,th.l,td.l{text-align:left}
tr.row:hover{background:color-mix(in srgb,var(--ac) 7%,transparent)}
td.name{font-weight:600}
.bar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--bd);min-width:140px}
.bar span{display:block;height:100%}
.chip{display:inline-block;background:color-mix(in srgb,var(--ac) 14%,transparent);color:var(--ac);border-radius:99px;padding:2px 10px;font-size:12px;margin-left:6px;cursor:pointer}
.red{color:var(--b4);font-weight:600}
tfoot td{font-weight:700;border-bottom:0}
@media(max-width:560px){.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div><h1>Sales Outstanding</h1><div class="sub">By region, sales manager and sales executive · as of <span id="asof"></span></div></div>
  <button id="theme" aria-label="Toggle theme">◐</button>
</header>

<div class="kpis" id="kpis"></div>

<div class="card">
  <div class="tabs" id="tabs">
    <button data-v="region">Region</button>
    <button data-v="manager">Sales Manager</button>
    <button data-v="exec">Sales Executive</button>
    <span class="sp"></span>
    <select id="reg"></select>
    <input id="q" type="search" placeholder="Search name…" style="width:150px">
  </div>
  <div class="legend" id="legend"></div>
  <div class="tw"><table id="tbl"></table></div>
  <div class="sub" style="margin-top:8px">Tip: tap a region or manager row to drill down. Tap column headers to sort. Sample data shown.</div>
</div>
</div>

<script>
const BK=['0–30 days','31–60 days','61–90 days','90+ days'];
const CL=['var(--b1)','var(--b2)','var(--b3)','var(--b4)'];
const ORG={
 North:{'Rajesh Kumar':['Amit Singh','Neha Verma','Karan Malhotra'],'Sunita Rao':['Priya Sharma','Vikas Gupta','Anil Bedi']},
 South:{'Venkat Iyer':['Lakshmi Nair','Suresh Reddy','Divya Menon'],'Arun Pillai':['Karthik Raj','Meera Krishnan','Ganesh Babu']},
 East:{'Subir Das':['Ritwik Sen','Moumita Ghosh','Abhijit Roy'],'Tapan Bose':['Sneha Paul','Rahul Dey','Anindya Basu']},
 West:{'Hitesh Shah':['Jignesh Patel','Pooja Desai','Mehul Joshi'],'Deepak Kulkarni':['Rohan Pawar','Swati Kale','Nikhil Jadhav']}
};
let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const rows=[];
for(const r in ORG)for(const m in ORG[r])for(const e of ORG[r][m]){
  const base=300000+rnd()*1500000;
  rows.push({region:r,manager:m,exec:e,b:[base*(.8+rnd()*.5),base*(.3+rnd()*.4),base*(.1+rnd()*.3),base*(.02+rnd()*.3)].map(Math.round)});
}
const S={view:'region',region:'All',manager:'All',q:'',sort:'total',dir:-1};
const fmt=n=>'₹'+(n>=1e7?(n/1e7).toFixed(2)+' Cr':n>=1e5?(n/1e5).toFixed(2)+' L':n.toLocaleString('en-IN'));
const tot=b=>b.reduce((a,c)=>a+c,0);
const $=id=>document.getElementById(id);
$('asof').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});

function filtered(){return rows.filter(r=>(S.region==='All'||r.region===S.region)&&(S.manager==='All'||r.manager===S.manager))}
function agg(list,key){
  const m={};
  list.forEach(r=>{const k=r[key];m[k]??={name:k,region:r.region,manager:r.manager,b:[0,0,0,0],n:0};r.b.forEach((v,i)=>m[k].b[i]+=v);m[k].n++});
  return Object.values(m).map(o=>({...o,total:tot(o.b),over:o.b[2]+o.b[3],crit:o.b[3]}));
}
function render(){
  const list=filtered(),all=agg(list,'exec');
  const T=all.reduce((a,o)=>a+o.total,0),O=all.reduce((a,o)=>a+o.over,0),C=all.reduce((a,o)=>a+o.crit,0);
  $('kpis').innerHTML=[['Total outstanding',fmt(T)],['Overdue 60+ days',fmt(O)+' · '+(T?(O/T*100).toFixed(0):0)+'%'],['Critical 90+ days',fmt(C)+' · '+(T?(C/T*100).toFixed(0):0)+'%'],['Sales executives',all.length]]
   .map(k=>`<div class="card kpi"><span>${k[0]}</span><b>${k[1]}</b></div>`).join('');
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===S.view));
  $('legend').innerHTML=BK.map((b,i)=>`<span><i style="background:${CL[i]}"></i>${b}</span>`).join('')+
    (S.manager!=='All'?`<span class="chip" data-clr="m">Manager: ${S.manager} ✕</span>`:'');
  let data=agg(list,S.view==='exec'?'exec':S.view);
  const q=S.q.toLowerCase();if(q)data=data.filter(o=>o.name.toLowerCase().includes(q));
  data.sort((a,b)=>{const x=a[S.sort],y=b[S.sort];return (typeof x==='string'?x.localeCompare(y):x-y)*S.dir});
  const mx=Math.max(1,...data.map(o=>o.total));
  const ex=S.view!=='region',em=S.view==='exec';
  const th=(k,l,c)=>`<th data-s="${k}" class="${c||''}">${l}${S.sort===k?(S.dir<0?' ↓':' ↑'):''}</th>`;
  const head=`<thead><tr>${th('name',S.view==='region'?'Region':S.view==='manager'?'Sales Manager':'Sales Executive')}${ex?th('region','Region','l'):''}${em?th('manager','Manager','l'):''}${S.view!=='exec'?th('n','Execs'):''}${BK.map((b,i)=>`<th data-s="b${i}">${b}</th>`).join('')}${th('total','Total')}<th class="l">Split</th></tr></thead>`;
  data.forEach(o=>o.b.forEach((v,i)=>o['b'+i]=v));
  const body=data.map(o=>`<tr class="row" data-n="${o.name}" ${S.view!=='exec'?'style="cursor:pointer"':''}>
   <td class="name">${o.name}</td>${ex?`<td class="l">${o.region}</td>`:''}${em?`<td class="l">${o.manager}</td>`:''}${S.view!=='exec'?`<td>${o.n}</td>`:''}
   ${o.b.map((v,i)=>`<td class="${i==3?'red':''}">${fmt(v)}</td>`).join('')}<td><b>${fmt(o.total)}</b></td>
   <td class="l"><div class="bar" style="width:${Math.max(8,o.total/mx*100)}%">${o.b.map((v,i)=>`<span style="width:${o.total?v/o.total*100:0}%;background:${CL[i]}"></span>`).join('')}</div></td></tr>`).join('');
  const sums=[0,1,2,3].map(i=>data.reduce((a,o)=>a+o.b[i],0));
  const foot=`<tfoot><tr><td>Total</td>${ex?'<td></td>':''}${em?'<td></td>':''}${S.view!=='exec'?`<td>${data.reduce((a,o)=>a+o.n,0)}</td>`:''}${sums.map(v=>`<td>${fmt(v)}</td>`).join('')}<td>${fmt(tot(sums))}</td><td></td></tr></tfoot>`;
  $('tbl').innerHTML=head+`<tbody>${body||'<tr><td colspan="9" style="text-align:center;color:var(--mut)">No results</td></tr>'}</tbody>`+foot;
}
$('reg').innerHTML=['All',...Object.keys(ORG)].map(r=>`<option value="${r}">${r==='All'?'All regions':r}</option>`).join('');
$('reg').onchange=e=>{S.region=e.target.value;S.manager='All';render()};
$('q').oninput=e=>{S.q=e.target.value;render()};
$('tabs').onclick=e=>{const v=e.target.dataset.v;if(v){S.view=v;S.sort='total';S.dir=-1;render()}};
$('legend').onclick=e=>{if(e.target.dataset.clr){S.manager='All';render()}};
$('tbl').onclick=e=>{
  const h=e.target.closest('th');
  if(h&&h.dataset.s){S.dir=S.sort===h.dataset.s?-S.dir:-1;S.sort=h.dataset.s;return render()}
  const tr=e.target.closest('tr.row');if(!tr)return;
  const n=tr.dataset.n;
  if(S.view==='region'){S.region=n;$('reg').value=n;S.view='manager'}
  else if(S.view==='manager'){S.manager=n;S.view='exec'}
  S.sort='total';S.dir=-1;render();
};
$('theme').onclick=()=>{const d=document.documentElement,dark=getComputedStyle(d).colorScheme==='dark';d.dataset.theme=dark?'light':'dark'};
render();
</script>
</body>
</html>
